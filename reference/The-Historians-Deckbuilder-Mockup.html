  $("me").innerHTML='<div class="cv">'+p.prestige+' prestige · '+cvHTML(p)+'</div>'+bonusSum(p,false)+shelfHTML(p)+(p.cv.length?'<div class="note" style="margin-top:8px">'+p.cv.map(x=>esc((x.type==="book"?"Book":x.type==="article"?"Article":"Paper")+": "+x.title+" (+"+x.pts+")")).join(" · ")+'</div>':"");
  const mt=myTurn();
  $("hand").innerHTML=p.hand.map(c=>{const on=UI.sel.includes(c.uid),isA=c.uid===UI.a;let click=false;
      if(mt){if(!UI.mode)click=c.kind==="action";else if(UI.mode==="keep")click=true;else if(UI.mode==="organize")click=false;else if(!isA)click=(UI.mode==="research"||UI.mode==="network")?true:c.kind==="source"}
      const o={cls:(on||isA?"sel ":"")+(click&&UI.mode==="keep"?"target ":"")+(click?"click ":"")+(mt&&UI.mode&&!click&&!isA?"dim":""),attr:click?'data-hand="'+c.uid+'"':""};
      return cardHTML(c,o)}).join("")+p.play.map(c=>actHTML(c,{cls:"played"})).join("")||'<div class="note">No cards in hand.</div>';
  $("piles").innerHTML='Deck: '+p.deck.length+' · <a href="#" data-pile="1">Discard pile: '+p.discard.length+'</a> · Played cards (faded) go to your discard pile at the end of the turn.';
  $("log").innerHTML=S.log.slice().reverse().map(l=>'<div><span class="t">R'+l.r+'</span> '+esc(l.t)+'</div>').join("");
  renderDock()}

function bookSel(){const p=me();return bookCheck(p,def(REG[UI.a]),UI.sel.map(u=>REG[u]),UI.shelf)}
function renderDock(){let msg="",st="",b="";const p=me();
  if(S.over){msg="The game is over.";b='<button data-do="results">Results</button>'}
  else if(!myTurn()){msg=esc(cur().name)+" is taking a turn…"}
  else if(!UI.mode){msg="<b>Your turn.</b> Click an action card in your hand to play it. You may play any number of them.";b='<button data-do="end">End turn</button>'}
  else if(UI.mode==="keep"){const lim=keepLimit(p),k=UI.sel.length;msg="<b>End of turn.</b> You may keep up to "+lim+" card"+(lim===1?"":"s")+" in hand for next turn. Click to choose.";st=k+" of "+lim+" chosen.";b='<button data-do="keepok">'+(k?"End turn, keeping "+k:"End turn, keeping nothing")+'</button><button class="ghost" data-do="cancel">Back</button>'}
  else if(UI.mode==="organize"){msg="<b>Organize.</b> Choose the trash cards to throw out."}
  else{const d=def(REG[UI.a]),n=UI.sel.length;
    if(UI.mode==="research"&&S.pending){msg="<b>Research.</b> Choose which cards to put back."}
    else if(UI.mode==="research"){msg="<b>"+esc(d.name)+".</b> Select cards in your hand to discard, then click an argument stack.";{const lk=B(p,"Map")+(d.look||0),tk=n+(d.bonus||0);st=n?"Discarding "+n+": you will "+(lk?"look at "+(tk+lk)+" and keep "+tk:"take "+tk)+" from the stack you click.":"Nothing selected yet."}}
    if(UI.mode==="network"){msg="<b>"+esc(d.name)+".</b> Select cards to discard, then click an upgrade you can afford.";st="Discards count as "+(n+(d.bonus||0)+B(p,"Letter"))+"."}
    if(UI.mode==="conference"){msg="<b>"+esc(d.name)+".</b> Select one source in your hand.";b='<button data-do="ok" '+(n===1?"":"disabled")+'>Publish paper</button>'}
    if(UI.mode==="article"){const ok=n===2&&sameEra(REG[UI.sel[0]],REG[UI.sel[1]]);
      if(UI.step===1){msg="<b>Which card goes on your bookshelf?</b> The other goes to your discard pile.";b=UI.sel.map(u=>'<button data-show="'+u+'">'+esc(src(REG[u]).title)+'</button>').join("")}
      else{msg="<b>"+esc(d.name)+".</b> Select two sources from the same era.";st=n===2&&!ok?"Those two are from different eras.":n+" of 2 selected.";b='<button data-do="ok" '+(ok?"":"disabled")+'>Continue</button>'}}
    if(UI.mode==="book"&&UI.step===1){msg="<b>Which card from your hand goes on your bookshelf?</b> The others go back under their argument stacks.";st=bookSel().msg;b=UI.sel.map(u=>'<button data-bshow="'+u+'">No. '+src(REG[u]).num+" "+esc(src(REG[u]).title)+'</button>').join("")}
    else if(UI.mode==="book"){const r=bookSel();msg="<b>"+esc(d.name)+".</b> Select "+(d.min||CONFIG.bookMin)+"+ cards that share a thesis letter (big or small): at least "+CONFIG.bookMinFromHand+" from hand, the rest from any bookshelf.";st=r.msg;b='<button data-do="ok" '+(r.ok?"":"disabled")+'>Continue</button>'}
    b+='<button class="ghost" data-do="cancel">Cancel</button>'}
  $("prompt").innerHTML=msg;$("status").textContent=st;$("btns").innerHTML=b}

function modal(html,close){$("ovroot").innerHTML='<div class="ov" '+(close===false?"":'data-close="1"')+'><div class="modal">'+html+'</div></div>'}
function closeModal(){$("ovroot").innerHTML=""}
function readCard(uid){const c=REG[uid],d=src(c);
  modal('<div class="mono" style="color:var(--mute)">'+esc(d.type)+' · '+esc(d.date)+'</div><h3>'+esc(d.title)+'</h3><div class="au" style="font-style:italic">'+esc(d.author)+'</div>'+
    (d.quote?'<div class="q">'+esc(d.quote)+'</div>':"")+'<p>'+esc(d.content)+'</p><div class="bonus"><b>Passive bonus: '+esc(BONUS[d.type].name)+'.</b> '+esc(BONUS[d.type].text)+' Counts in your hand and on your bookshelf.</div><div class="sig">'+esc(d.significance)+'</div>'+
    '<div class="tags" style="margin-top:12px"><span class="num">'+d.num+'</span>'+tagsHTML(d)+'<span class="mono">&nbsp;'+esc(d.era)+(d.stance?" · "+esc(d.stance):"")+'</span></div>'+
    '<div style="margin-top:6px">Thesis '+d.arg+': '+esc(DATA.theses[d.arg].q)+(d.sub?'<br><span class="note">Also speaks to '+d.sub+': '+esc(DATA.theses[d.sub].q)+'</span>':"")+'</div>'+
    '<div class="cit">'+esc(d.citation)+'</div><div class="btns"><button data-close="1">Close</button></div>')}
function showCards(title,cards,note,pick){modal('<h3>'+esc(title)+'</h3>'+(note?'<p class="note">'+esc(note)+'</p>':"")+'<div class="row">'+(cards.length?cards.map(c=>{const o=pick?{cls:"click target",attr:'data-repl="'+c.uid+'"'}:{};return cardHTML(c,o)}).join(""):'<div class="note">Nothing here.</div>')+'</div><div class="btns"><button data-close="1">'+(pick?"Cancel":"Close")+'</button></div>')}
function results(){const r=ranking();modal('<h3>'+esc(r[0].name)+' wins</h3><table><tr><th>Historian</th><th>Prestige</th><th>Books</th><th>Articles</th><th>Papers</th><th>Cited</th><th>Trash</th></tr>'+
  r.map(q=>'<tr><td>'+esc(q.name)+'</td><td><b>'+q.prestige+'</b></td><td>'+q.cv.filter(x=>x.type==="book").length+'</td><td>'+q.cv.filter(x=>x.type==="article").length+'</td><td>'+q.cv.filter(x=>x.type==="paper").length+'</td><td>'+q.cites+'</td><td>'+(q.trash||0)+'</td></tr>').join("")+
  '</table><p class="note">'+S.round+' rounds played.</p><div class="btns"><button class="ghost" data-close="1">Look at the table</button><button data-do="new">New game</button></div>')}
function rules(){modal('<h3>How this mock-up plays</h3><ul class="rules">'+
  '<li><b>Setup:</b> each player chooses one argument stack and shuffles its top '+CONFIG.startCards+' cards into a personal deck of six action cards. Each stack also hides '+CONFIG.trashPerStack+' trash cards.</li>'+
  '<li>Draw '+CONFIG.handSize+' cards. On your turn play any number of action cards, then end the turn: you may keep one card, everything else goes to your discard pile, and you draw back up to '+CONFIG.handSize+'. When your deck runs out, your discard pile is shuffled to make a new one.</li>'+
  '<li><b>Research:</b> discard n cards, take n cards from one argument stack into your discard pile. They reach your hand after your next shuffle.</li>'+
  '<li><b>Attend Conference:</b> publish one source from hand as a conference paper (+'+CONFIG.paperPts+'). The card goes to your discard pile, so it can be presented again or published later.</li>'+
  '<li><b>Publish an Article:</b> two sources from the same era (+'+CONFIG.articlePts+'). One goes face up on your bookshelf; the other goes to your discard pile and stays in your deck.</li>'+
  '<li><b>Publish a Book:</b> '+CONFIG.bookMin+' or more cards that share a thesis letter, big or small . A book scores '+Object.keys(CONFIG.bookCardPts).filter(k=>k>=CONFIG.bookMin).map(k=>CONFIG.bookCardPts[k]+" for "+k+" cards").join(", ")+', plus '+CONFIG.bookBonus+'. At least '+CONFIG.bookMinFromHand+' must come from your hand; the rest may come from your bookshelf or a rival’s. Citing a rival’s card pays them +'+CONFIG.citePts+'. You may use each bookshelf card once. One card from your hand goes on your bookshelf; the other hand cards go back to the bottom of their argument stacks.</li>'+
  '<li><b>Book sets:</b> every source has a number, 1 to 40, in chronological order. A book earns a flat bonus for each set it contains. <b>Sequence</b> (+'+CONFIG.runPts+'): '+CONFIG.runMin+' or more consecutive numbers. <b>Range of Sources</b> (+'+CONFIG.typesPts+'): '+CONFIG.typesMin+' or more different source types. Bookshelf cards in the book count toward sets.</li>'+
  '<li><b>Network:</b> discard n cards and take an upgrade worth n or less from the conference space. It replaces a card of your choice in your discard pile: a replaced action is gone, a replaced source returns to the bottom of its stack.</li>'+
  '<li><b>Passive bonuses:</b> every source carries a bonus set by its type. It counts while the card is in your hand, including for the action that spends it, and permanently once the card is on your bookshelf. Bonuses add up.<br>'+Object.keys(BONUS).map(t=>'<span class="note">'+t+": "+esc(BONUS[t].name)+". "+esc(BONUS[t].text)+'</span>').join("<br>")+'</li>'+
  '<li><b>Organize:</b> remove any number of trash cards from your hand or discard pile. Trash cannot be published, and each one still in your deck at the end costs '+CONFIG.trashPenalty+' prestige. You may discard trash to pay for Research or Network.</li>'+
  '<li><b>End:</b> the game lasts '+CONFIG.rounds.short+', '+CONFIG.rounds.medium+' or '+CONFIG.rounds.long+' rounds (short, medium, long). Highest prestige wins.</li></ul>'+
  '<p class="note">All numbers and all eight upgrade cards are placeholders, set in the CONFIG and ACTIONS blocks at the top of the script.</p><div class="btns"><button data-close="1">Close</button></div>')}
function setup(){const names=["Player 1","Prof. Vance","Prof. Ito","Prof. Marsh"];
  modal('<h3>The Historians: deck-building mock-up</h3><p>Set the table. Bots play a simple greedy strategy; several humans can share this screen in turn.</p><table>'+
  [0,1,2,3].map(i=>'<tr><td>Seat '+(i+1)+'</td><td><input id="nm'+i+'" value="'+names[i]+'"></td><td><select id="st'+i+'"><option value="h"'+(i===0?" selected":"")+'>Human</option><option value="b"'+(i===1?" selected":"")+'>Bot</option>'+(i>1?'<option value="x" selected>Empty</option>':"")+'</select></td></tr>').join("")+
  '</table><p>Length: <select id="len"><option value="short">Short: '+CONFIG.rounds.short+' rounds</option><option value="medium" selected>Medium: '+CONFIG.rounds.medium+' rounds</option><option value="long">Long: '+CONFIG.rounds.long+' rounds</option></select></p><div class="btns"><button data-do="start">Start</button></div>',false)}
function start(){const seats=[];for(let i=0;i<4;i++){const t=$("st"+i).value;if(t!=="x")seats.push({name:$("nm"+i).value.trim()||("Seat "+(i+1)),bot:t==="b"})}
  newGame(seats,$("len").value);resetUI();busy=false;closeModal();VIEW=Math.max(0,S.players.findIndex(p=>!p.bot));render();draftNext()}
function draftNext(){render();
  if(S.phase!=="draft")return next();
  const p=S.players[S.draftAt];
  if(p.bot){botDraft();return draftNext()}
  VIEW=p.i;render();
  modal('<h3>'+esc(p.name)+': choose your field</h3><p>Take the top '+CONFIG.startCards+' cards of one argument stack into your starting deck. You will not see them until you choose, and some may be trash.</p><div class="row">'+
    LETTERS.map(L=>{const n=S.stacks[L].length,ok=n>=CONFIG.startCards;return '<div class="stack pick '+(ok?"":"off")+'" style="background:var(--'+L+')" '+(ok?'data-draft="'+L+'"':"")+'><div class="L">'+L+'</div><div class="q">'+esc(DATA.theses[L].q)+'</div><div class="mono">'+n+' cards</div></div>'}).join("")+'</div>',false)}
function rejModal(){const pd=S.pending,k=pd.seen.length-pd.keepN;
  modal('<h3>You found '+pd.seen.length+' cards: keep '+pd.keepN+'</h3><p class="note">Click '+k+' card'+(k===1?"":"s")+' to put back under stack '+pd.L+'. The rest go to your '+(pd.toHand?"hand":"discard pile")+'.</p><div class="row">'+pd.seen.map(c=>cardHTML(c,{cls:"click "+(UI.sel.includes(c.uid)?"dim":""),attr:'data-rej="'+c.uid+'"'})).join("")+'</div><div class="btns"><button data-do="rejok" '+(UI.sel.length===k?"":"disabled")+'>Put back '+UI.sel.length+' of '+k+'</button></div>',false)}
function orgModal(){const p=me(),t=[...p.hand,...p.discard].filter(c=>c.kind==="trash");
  modal('<h3>Organize: throw out trash</h3><p class="note">From your hand and discard pile. Click a card to keep it instead.</p><div class="row">'+t.map(c=>trashHTML(c,{cls:"click "+(UI.sel.includes(c.uid)?"sel":""),attr:'data-org="'+c.uid+'"'})).join("")+'</div><div class="btns"><button class="ghost" data-do="cancel">Cancel</button><button data-do="orgok" '+(UI.sel.length?"":"disabled")+'>Throw out '+UI.sel.length+'</button></div>',false)}
function humans(){return S.players.filter(p=>!p.bot).length}
function next(){ // after any turn change
  if(S.over){render();results();return}
  const p=cur();
  if(p.bot){busy=true;render();setTimeout(botLoop,650);return}
  busy=false;
  if(VIEW!==p.i&&humans()>1){modal('<h3>Pass the screen to '+esc(p.name)+'</h3><p>The next hand is hidden until you continue.</p><div class="btns"><button data-do="pass">I am '+esc(p.name)+'</button></div>',false);return}
  VIEW=p.i;render()}
function botLoop(){if(S.over)return;if(botStep()){render();setTimeout(botLoop,650)}else{endTurn(botKeep());next()}}
function fail(r){if(typeof r==="string"){$("status").textContent=r;return true}return false}

document.addEventListener("click",ev=>{
  const t=ev.target,q=s=>t.closest("["+s+"]");let e;
  if((e=q("data-read"))){ev.preventDefault();readCard(+e.dataset.read);return}
  if((e=q("data-do"))){const k=e.dataset.do,p=S&&me();
    if(k==="start")return start();if(k==="new")return setup();if(k==="results")return results();
    if(k==="pass"){VIEW=cur().i;closeModal();return render()}
    if(k==="cancel"){resetUI();closeModal();return render()}
    if(k==="rejok"){const r=finishResearch(S.pending,UI.sel);if(typeof r==="string")return;closeModal();resetUI();return render()}
    if(k==="draftok"){closeModal();return draftNext()}
    if(k==="end"){if(!myTurn())return;resetUI();if(p.hand.length&&keepLimit(p)){UI.mode="keep";return render()}endTurn();return next()}
    if(k==="keepok"){const ks=UI.sel.slice();resetUI();endTurn(ks);return next()}
    if(k==="orgok"){const r=doOrganize(p,UI.a,UI.sel);closeModal();resetUI();render();fail(r);return}
    if(k==="ok"){
      if(UI.mode==="conference"){if(!fail(doConference(p,UI.a,UI.sel[0]))){resetUI();render()}}
      else if(UI.mode==="article"){UI.step=1;renderDock()}
      else if(UI.mode==="book"){if(bookSel().ok){UI.step=1;render()}}
      return}}
  if((e=q("data-draft"))){const p=S.players[S.draftAt],r=doDraft(e.dataset.draft);if(typeof r==="string")return;
    modal('<h3>'+esc(p.name)+': your starting sources</h3><p class="note">These are shuffled into your deck with your six action cards.</p><div class="row">'+r.got.map(c=>cardHTML(c)).join("")+'</div><div class="btns"><button data-do="draftok">Continue</button></div>',false);return}
  if((e=q("data-rej"))){if(q("data-read")&&t.closest("[data-read]"))return;const u=+e.dataset.rej,i=UI.sel.indexOf(u),k=S.pending.seen.length-S.pending.keepN;if(i>=0)UI.sel.splice(i,1);else{while(UI.sel.length>=k)UI.sel.shift();UI.sel.push(u)}return rejModal()}
  if((e=q("data-org"))){const u=+e.dataset.org,i=UI.sel.indexOf(u);if(i>=0)UI.sel.splice(i,1);else UI.sel.push(u);return orgModal()}
  if((e=q("data-bshow"))){const p=me();if(!fail(doBook(p,UI.a,UI.sel,UI.shelf,+e.dataset.bshow))){resetUI();render()}return}
  if((e=q("data-show"))){const p=me();if(!fail(doArticle(p,UI.a,UI.sel[0],UI.sel[1],+e.dataset.show))){resetUI();render()}return}
  if((e=q("data-repl"))){const p=me();const r=doNetwork(p,UI.a,UI.sel,UI.up,+e.dataset.repl);closeModal();if(!fail(r))resetUI();render();return}
  if((e=q("data-close"))){if(t===e||t.tagName==="BUTTON"){closeModal()}return}
  if((e=q("data-pile"))){ev.preventDefault();showCards("Your discard pile",me().discard,"These return to your deck at the next shuffle.");return}
  if(!S||!myTurn())return;
  const p=me();
  if((e=q("data-stack"))){if(S.pending)return;const r=doResearch(p,UI.a,UI.sel,e.dataset.stack);if(!fail(r)){const d=def(REG[UI.a]);
      if(r.pending){UI.sel=[];render();return rejModal()}
      resetUI();render();showCards("You found",r.got,d.toHand?"Added to your hand.":"Added to your discard pile. You will draw them after your next shuffle.")}return}
  if((e=q("data-up"))){UI.up=e.dataset.up;showCards("Replace which card with "+ACTIONS[UI.up].name+"?",[...UI.sel.map(u=>REG[u]),...p.discard],"Choose a card from your discard pile, including the ones you are discarding now. A replaced action is removed; a replaced source goes back to its stack.",true);return}
  if((e=q("data-shelf"))){if(UI.step===1)return;const u=+e.dataset.shelf,i=UI.shelf.indexOf(u);if(i>=0)UI.shelf.splice(i,1);else UI.shelf.push(u);return render()}
  if((e=q("data-hand"))){const u=+e.dataset.hand,c=REG[u];
    if(UI.mode==="keep"){const i=UI.sel.indexOf(u),lim=keepLimit(p);if(i>=0)UI.sel.splice(i,1);else{while(UI.sel.length>=lim)UI.sel.shift();UI.sel.push(u)}return render()}
    if(!UI.mode){const d=def(c);if(d.kind==="draw"){doDraw(p,u);return render()}
      if(d.kind==="organize"){const t=[...p.hand,...p.discard].filter(x=>x.kind==="trash");if(!t.length){$("status").textContent="You have no trash cards in your hand or discard pile.";return}
        UI.mode="organize";UI.a=u;UI.sel=t.map(x=>x.uid);render();return orgModal()}
      UI.mode=d.kind;UI.a=u;return render()}
    if(UI.step===1)return;
    const i=UI.sel.indexOf(u);if(i>=0)UI.sel.splice(i,1);else{if(UI.mode==="conference")UI.sel=[];if(UI.mode==="article"&&UI.sel.length>=2)UI.sel.shift();UI.sel.push(u)}
    return render()}
});
$("bRules").onclick=rules;$("bNew").onclick=setup;
setup();
}
if(typeof module!=="undefined")module.exports={botReject,finishResearch,bookSets,B,BONUS,newGame,botStep,botDraft,botKeep,endTurn,trashCount,ranking,books,CONFIG,ACTIONS,get S(){return S},cur};
</script>
</body>
</html>
