# Runs on every push and pull request, and as the first stage of deploy.yml, which uploads only if it passes.
name: test

on:
  push:
    branches-ignore: [main] # main is tested by deploy.yml, which calls this workflow
  pull_request:
  workflow_call:

jobs:
  js:
    name: JS tests and simulations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run data:validate
      # A slice of the mock-up parity check; the full run takes ~7 minutes (npm run parity).
      - run: node tools/parity.mjs --games 100 --fuzz 30

  frontend:
    name: Frontend builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

  php:
    name: PHP ${{ matrix.php }} matches the JS engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"] # 8.1 is the oldest the engine supports; check GreenGeeks' version in cPanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          tools: none
          coverage: none
      - run: npm run lint:php
      - run: npm run conformance
      # The whole backend over HTTP, on PHP's built-in server with a throwaway SQLite database.
      - run: npm run test:backend
